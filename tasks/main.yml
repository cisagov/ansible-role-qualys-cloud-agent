---
- name: Load var file with package names based on the OS type
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - >-
          {{ ansible_distribution }}_{{ ansible_distribution_release
          }}_{{ ansible_architecture }}.yml
        - "{{ ansible_distribution }}_{{ ansible_distribution_release }}.yml"
        - "{{ ansible_distribution }}_{{ ansible_architecture }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}_{{ ansible_architecture }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

# Needed to check if Qualys Cloud Agent is already installed
- name: Get a list of the packages installed
  ansible.builtin.package_facts:

- name: Install the Qualys Cloud Agent
  when: not "qualys-cloud-agent" in ansible_facts["packages"]
  block:
    - name: Fetch list of keys in bucket
      amazon.aws.s3_object_info:
        bucket_name: "{{ qualys_third_party_bucket_name }}"
      become: false
      delegate_to: localhost
      register: keys

    - name: Install Qualys Cloud Agent package file
      vars:
        package_file: >-
          {{ keys.s3_keys | select('search', package_file_regex) | first }}
      block:
        - name: Grab the Qualys Cloud Agent system package from S3
          amazon.aws.s3_object:
            bucket: "{{ qualys_third_party_bucket_name }}"
            object: "{{ package_file }}"
            dest: /tmp/{{ package_file }}
            mode: get
          become: false
          delegate_to: localhost

        - name: Copy the Qualys Cloud Agent system package
          ansible.builtin.copy:
            dest: /tmp/{{ package_file }}
            mode: u=rw,g=,o=
            src: /tmp/{{ package_file }}

        - name: Load tasks file based on the OS type
          ansible.builtin.include_tasks: "{{ lookup('first_found', params) }}"
          vars:
            params:
              files:
                - "{{ ansible_distribution }}_{{ ansible_distribution_release }}.yml"
                - "{{ ansible_distribution }}.yml"
                - "{{ ansible_os_family }}.yml"
              paths:
                - "{{ role_path }}/tasks"

        - name: Enable the Qualys Cloud Agent service
          ansible.builtin.service:
            enabled: true
            name: qualys-cloud-agent

        - name: Delete local copy of the Qualys Cloud Agent system package
          ansible.builtin.file:
            path: /tmp/{{ package_file }}
            state: absent
          become: false
          delegate_to: localhost

        - name: Delete remote copy of the Qualys Cloud Agent system package
          ansible.builtin.file:
            path: /tmp/{{ package_file }}
            state: absent
